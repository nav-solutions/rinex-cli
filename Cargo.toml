[package]
name = "rinex-cli"
version = "0.15.0"
license = "MPL-2.0"
authors = ["Guillaume W. Bres <guillaume.bressaix@gmail.com>"]
description = "GNSS data post processing and quality control, powered by GNSS-Qc"
homepage = "https://github.com/nav-solutions"
repository = "https://github.com/nav-solutions/rinex-cli"
keywords = ["geo", "gps", "rinex", "galileo", "timing"]
categories = [
    "science",
    "command-line-interface",
    "command-line-utilities",
]
edition = "2021"
rust-version = "1.89"
readme = "README.md"
exclude = [
    "data/*",
]

[features]
default = []

# P.V.T solutions (nav command): GNSS-RTK solver, ANISE almanac.
navigation = ["gnss-qc/navigation"]

# Legacy name of the navigation option
ppp = ["navigation"]

# CGGTTS solutions (cggtts command)
cggtts = ["navigation", "gnss-qc/cggtts", "dep:cggtts"]

# IONEX: TEC maps (tec command), Ionospheric Pierce Points (ipp command)
ionex = ["gnss-qc/ionex", "dep:ionex"]

# Embeds the ANISE dataset at build time: no Internet access at runtime
embed_ephem = ["navigation", "gnss-qc/embed_ephem"]

# PDF reports (Typst engine, embedded fonts)
pdf = ["dep:typst-as-lib", "dep:typst-pdf", "dep:typst-layout"]

[dependencies.rinex]
version = "0.25.0-alpha"
features = [
    "obs",
    "meteo",
    "clock",
    "antex",
    "qc",
    "processing",
    "serde",
    "flate2",
]

[dependencies.typst-as-lib]
version = "0.18"
optional = true
features = [
    "typst-kit-fonts",
    "typst-kit-embed-fonts",
]

[dependencies]
log = "0.4"
walkdir = "2.4"
env_logger = "0.11"
thiserror = "2"
itertools = "0.14"
maud = "0.26"
serde_json = "1"
cggtts = { version = "4", optional = true }
gnss-rs = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
clap = { version = "4.4", features = ["derive", "color", "env", "wrap_help"] }
hifitime = { version = "4", features = ["serde", "std"] }
typst-pdf = { version = "0.15", optional = true }
typst-layout = { version = "0.15", optional = true }

sp3 = { version = "1.5", features = ["qc", "processing", "flate2"] }

ionex = { version = "0.2", optional = true, default-features = false, features = ["flate2"] }

gnss-qc-traits = { version = "0.6", features = ["processing"] }
gnss-qc = { version = "0.8", default-features = false, features = ["sp3", "flate2", "serde", "log"] }
