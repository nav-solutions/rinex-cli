name: Benchmarking

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
  workflow_dispatch:

env:
  RUST_BACKTRACE: 1
  RUST_LOG: trace
  CARGO_TERM_COLOR: always

jobs:
  benchmarking:
    name: Daily Results
    runs-on: ubuntu-latest
    env:
      CARGO: cargo
      RUST_BACKTRACE: 1
    
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Build
        run: cargo build --all-features -r
      
      - name: Prepare runs
        run: |
            mkdir -p /tmp/logs/ppp
            mkdir -p /tmp/logs/cggtts
            echo "ARCHIVE=gnss-rtk-${{ github.ref_name }}" >> $GITHUB_ENV
            echo "ASSET=$ARCHIVE.tar.gz" >> $GITHUB_ENV

      - name: Galileo BRDC (+CPP)
        run: |
            ./target/release/rinex-cli -q -o /tmp/WS --session brdc_cpp \
                -P "Gal;C1C,C5Q" \
                -f data/CRNX/V3/MOJN00DNK_R_20201770000_01D_30S_MO.crx.gz \
                -f data/NAV/V3/MOJN00DNK_R_20201770000_01D_MN.rnx.gz \
                --report html,pdf \
                nav --method cpp --static -c gal |
                tee /tmp/logs/ppp/brdc_cpp_mojn_e1e5.logs

      - name: Galileo BRDC (+CPP) (+CGGTTS)
        run: |
            ./target/release/rinex-cli -q -o /tmp/WS --session brdc_cpp_cggtts \
                -P "Gal;C1C,C5Q" \
                -f data/CRNX/V3/MOJN00DNK_R_20201770000_01D_30S_MO.crx.gz \
                -f data/NAV/V3/MOJN00DNK_R_20201770000_01D_MN.rnx.gz \
                cggtts --method cpp --static -c gal |
                tee /tmp/logs/cggtts/brdc_cpp_mojn_e1e5.logs

      - name: Galileo Final (+CPP)
        run: |
            ./target/release/rinex-cli -q -o /tmp/WS --session final_cpp \
                -P "Gal;C1C,C5Q" \
                -f data/CRNX/V3/MOJN00DNK_R_20201770000_01D_30S_MO.crx.gz \
                -f data/NAV/V3/MOJN00DNK_R_20201770000_01D_MN.rnx.gz \
                -f data/SP3/C/GRG0MGXFIN_20201770000_01D_15M_ORB.SP3.gz \
                nav --method cpp --static -c gal |
                tee /tmp/logs/ppp/final_cpp_mojn_e1e5.logs

      - name: Galileo Final (+PPP)
        run: |
            ./target/release/rinex-cli -q -o /tmp/WS --session final_ppp \
                -P "Gal;C1C,L1C,C5Q,L5Q" \
                -f data/CRNX/V3/MOJN00DNK_R_20201770000_01D_30S_MO.crx.gz \
                -f data/NAV/V3/MOJN00DNK_R_20201770000_01D_MN.rnx.gz \
                -f data/SP3/C/GRG0MGXFIN_20201770000_01D_15M_ORB.SP3.gz \
                nav --method ppp --static -c gal |
                tee /tmp/logs/ppp/final_ppp_mojn_e1e5.logs

      - name: RTK (+CPP) ESBC / MOJN
        run: |
            ./target/release/rinex-cli -q -o /tmp/WS --session rtk_cpp \
                -f data/CRNX/V3/ESBC00DNK_R_20201770000_01D_30S_MO.crx.gz \
                -f base=data/CRNX/V3/MOJN00DNK_R_20201770000_01D_30S_MO.crx.gz \
                -f data/NAV/V3/ESBC00DNK_R_20201770000_01D_MN.rnx.gz \
                nav --method cpp --base base |
                tee /tmp/logs/ppp/rtk_cpp_esbc_mojn.logs
