name: CI

on:
  push:
    branches: [ "main" ]
    tags:
      - "*"
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive
        fetch-depth: 0
    
    - uses: actions-rs/cargo@v1
      name: Linter 
      with:
        command: fmt
        args: --all -- --check
    
    - uses: actions-rs/toolchain@v1
      name: Install Rust
      with:
        toolchain: 1.89.0
        override: true
    
    - name: Build
      run: cargo build

    - name: Tests
      run: cargo test

    - name: Build (navigation)
      run: cargo build --features navigation

    - name: Build (all features)
      run: cargo build --all-features

    - name: Tests (all features)
      run: cargo test --all-features

    - name: Smoke tests
      run: |
        cargo build -r --features pdf
        ./target/release/rinex-cli -q \
            -f data/CRNX/V3/ESBC00DNK_R_20201770000_01D_30S_MO.crx.gz \
            -f data/NAV/V3/ESBC00DNK_R_20201770000_01D_MN.rnx.gz \
            index
        ./target/release/rinex-cli -q -o /tmp/WS \
            -f data/CRNX/V3/ESBC00DNK_R_20201770000_01D_30S_MO.crx.gz \
            -f data/NAV/V3/ESBC00DNK_R_20201770000_01D_MN.rnx.gz \
            --report html,pdf --data csv,jsonl \
            qc
        ./target/release/rinex-cli -q -o /tmp/WS --session orbits \
            -f data/NAV/V3/ESBC00DNK_R_20201770000_01D_MN.rnx.gz \
            -f data/SP3/C/GRG0MGXFIN_20201770000_01D_15M_ORB.SP3.gz \
            --report html,pdf \
            residuals orbit --max-age 7200
